<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Game — Game Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
</head>
<body>

  <nav class="gc-navbar">
    <div class="gc-nav-brand">
      <a href="index.html" style="text-decoration:none;color:inherit">
        <img src="../assets/logo.png" alt="Logo" width="40" onerror="this.style.display='none'">
        <span>Game Center</span>
      </a>
    </div>
    <div class="gc-nav-actions" id="navActions"></div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <h2 class="text-white fw-bold mb-4">➕ Add New Game</h2>

        <div id="pageAlert"></div>

        <form method="POST" action="../scripts/add_game.php" enctype="multipart/form-data" class="gc-form">
          <div class="mb-3">
            <label class="form-label">Game Title *</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Cyberpunk 2077" required maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Genre *</label>
            <input type="text" name="genre" class="form-control" placeholder="e.g. RPG, Action" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price ($) *</label>
            <input type="number" name="price" step="0.01" min="0" class="form-control" placeholder="0.00" required>
          </div>
          <div class="mb-3">
            <label class="form-label">About The Game *</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Game description..." required></textarea>
          </div>

          <!-- Image: URL or Upload -->
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" name="image_url" id="imageUrlInput" class="form-control" placeholder="https://...">
            <div class="form-text text-white-50">Or upload an image file below (takes priority)</div>
          </div>
          <div class="mb-4">
            <label class="form-label">Upload Image File</label>
            <input type="file" name="image_file" class="form-control" accept="image/jpeg,image/png,image/webp" id="imageFileInput">
            <div class="form-text text-white-50">JPG / PNG / WEBP — max 5 MB</div>
            <!-- Preview -->
            <img id="imagePreview" src="" alt="Preview" class="mt-3 rounded-3 img-fluid" style="display:none;max-height:180px">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100">Add Game</button>
            <a href="index.html" class="btn btn-secondary w-100">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth_ui.js"></script>
  <script>
    // Image preview
    document.getElementById('imageFileInput').addEventListener('change', function() {
      const file = this.files[0];
      const preview = document.getElementById('imagePreview');
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    });

    // Show query param alerts
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('pageAlert').innerHTML =
        `<div class="alert alert-danger">${decodeURIComponent(params.get('error'))}</div>`;
    }

    // Guard: admin only
    fetch('../scripts/session_status.php')
      .then(r => r.json())
      .then(s => {
        if (!s.logged_in || s.role !== 'admin') {
          window.location.href = 'login.html';
        }
      });
  </script>
</body>
</html>
