<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Details — Game Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
  <style>
    .game-detail-hero { position:relative;width:100%;min-height:340px;overflow:hidden;border-radius:20px;margin-bottom:28px; }
    .game-detail-hero img { width:100%;height:340px;object-fit:cover;display:block;border-radius:20px; }
    .game-detail-hero-overlay { position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,25,0.92) 0%,rgba(10,10,25,0.3) 60%,transparent 100%);border-radius:20px; }
    .game-detail-hero-content { position:absolute;bottom:28px;left:28px;right:28px; }
    .game-detail-title { font-family:'Rajdhani',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:#fff;margin:0 0 8px;text-shadow:0 2px 12px rgba(0,0,0,.6);line-height:1.1; }
    .game-detail-meta { display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
    .game-detail-card { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:18px;padding:28px;margin-bottom:20px; }
    .game-detail-desc { color:rgba(255,255,255,.75);font-size:.97rem;line-height:1.75;margin:0; }
    .game-buy-card { background:rgba(108,60,225,0.1);border:1px solid rgba(108,60,225,0.3);border-radius:18px;padding:28px;position:sticky;top:80px; }
    .game-buy-price { font-family:'Rajdhani',sans-serif;font-size:2.4rem;font-weight:700;color:#fff;line-height:1;margin-bottom:6px; }
    .game-buy-price.free { background:linear-gradient(135deg,#00d4ff,#6c3ce1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .game-buy-label { color:rgba(255,255,255,.45);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:20px; }
    .btn-add-cart { width:100%;padding:14px;background:linear-gradient(135deg,var(--gc-purple),var(--gc-purple-2));border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:.3px; }
    .btn-add-cart:hover { opacity:.9;transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,60,225,.5); }
    .btn-add-cart:disabled { opacity:.6;cursor:not-allowed;transform:none;box-shadow:none; }
    .game-status-block { width:100%;padding:13px 16px;border-radius:12px;font-size:.95rem;font-weight:700;text-align:center;letter-spacing:.3px; }
    .game-status-owned { background:rgba(40,168,101,.15);border:1px solid rgba(40,168,101,.35);color:#7effc2; }
    .game-status-incart { background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);color:#7ee8ff; }
    .back-link { display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.55);text-decoration:none;font-size:.875rem;margin-bottom:24px;transition:color .2s; }
    .back-link:hover { color:#fff; }
    .login-prompt { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;text-align:center;font-size:.875rem;color:rgba(255,255,255,.6); }
    .login-prompt a { color:#9b5de5;font-weight:600;text-decoration:none; }
   
   .rv-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:18px; }
.rv-avg { font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:700;color:#ffc107; }
.rv-form { background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:20px;margin-bottom:18px; }
.rv-star { font-size:1.6rem;cursor:pointer;color:rgba(255,255,255,.2);transition:color .15s;line-height:1; }
.rv-star.rv-star-filled { color:#ffc107; }
.rv-star.rv-star-hover  { color:#ffe066; }
.rv-star-row { display:flex;gap:4px; }
.rv-list { display:flex;flex-direction:column;gap:12px; }
.rv-item { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px 18px; }
.rv-item-header { display:flex;align-items:center;gap:12px;margin-bottom:8px; }
.rv-avatar { width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gc-purple),var(--gc-purple-2));display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;font-family:'Rajdhani',sans-serif;overflow:hidden;flex-shrink:0;position:relative; }
.rv-avatar-img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
.rv-avatar-initials { display:flex;align-items:center;justify-content:center;width:100%;height:100%; }
.rv-username { font-weight:700;color:#fff;font-size:.88rem; }
.rv-date { font-size:.72rem;color:rgba(255,255,255,.35); }
.rv-stars { display:flex;gap:2px; }
.rv-comment { color:rgba(255,255,255,.65);font-size:.875rem;line-height:1.6;margin:0; }
   
   
    #gameDetailSkeleton .skeleton-line { background:rgba(255,255,255,0.07);border-radius:8px;animation:shimmer 1.4s infinite; }
    @keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }
  </style>
</head>
<body>

  <nav class="gc-navbar">
    <div class="gc-nav-brand">
      <a href="index.html" style="text-decoration:none;color:inherit">
        <img src="../assets/logo.png" alt="Logo" width="40" onerror="this.style.display='none'">
        <span>Game Center</span>
      </a>
    </div>
    <div class="gc-nav-actions" id="navActions"></div>
  </nav>

  <div class="container py-4" id="gameDetailContainer">
    <div id="gameDetailSkeleton">
      <div class="skeleton-line mb-3" style="width:80px;height:18px"></div>
      <div class="skeleton-line mb-4" style="width:100%;height:340px;border-radius:20px"></div>
      <div class="row g-4">
        <div class="col-md-8">
          <div class="skeleton-line mb-3" style="width:60%;height:28px"></div>
          <div class="skeleton-line mb-2" style="width:100%;height:14px"></div>
          <div class="skeleton-line" style="width:80%;height:14px"></div>
        </div>
        <div class="col-md-4">
          <div class="skeleton-line" style="width:100%;height:200px;border-radius:18px"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth_ui.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = parseInt(params.get('id'));
    let session  = null;

    if (!gameId) window.location.href = 'index.html';

    function onSessionReady(s) {
      session = s;
      if (s.role === 'admin') { window.location.href = 'index.html'; return; }
      loadGame();
    }

    function loadGame() {
      const isUser = session && session.logged_in && session.role !== 'admin';

      // ✅ Updated fetch paths
      const gamesP = fetch('../features/games/get_games.php').then(r => r.json());
      const ownedP = isUser
        ? fetch('../features/profile/get_library_ids.php').then(r => r.json()).catch(() => [])
        : Promise.resolve([]);
      const cartP  = isUser
        ? fetch('../features/cart/get_cart_ids.php').then(r => r.json()).catch(() => [])
        : Promise.resolve([]);

      Promise.all([gamesP, ownedP, cartP])
        .then(([games, ownedIds, cartIds]) => {
          const game = games.find(g => parseInt(g.id) === gameId);
          if (!game) {
            document.getElementById('gameDetailContainer').innerHTML =
              `<div class="alert alert-danger">Game not found. <a href="index.html">Back to store</a></div>`;
            return;
          }
          renderGame(game, new Set(ownedIds.map(Number)), new Set(cartIds.map(Number)));
        })
        .catch(() => {
          document.getElementById('gameDetailContainer').innerHTML =
            `<div class="alert alert-danger">Failed to load game.</div>`;
        });
    }

    function renderGame(game, ownedSet, cartSet) {
      const imgSrc  = game.resolved_image || game.image_url || '../assets/profile.png';
      const price   = parseFloat(game.price);
      const isFree  = price === 0;
      const isUser  = session && session.logged_in && session.role !== 'admin';
      const isOwned = ownedSet.has(parseInt(game.id));
      const inCart  = cartSet.has(parseInt(game.id));

      const priceHtml = `
        <div class="game-buy-price ${isFree ? 'free' : ''}">${isFree ? 'Free' : '$' + price.toFixed(2)}</div>
        <div class="game-buy-label">${isFree ? 'No purchase required' : 'One-time purchase'}</div>`;

      let buySection = '';
      if (isUser) {
        if (isOwned) {
          buySection = priceHtml + `
            <div class="game-status-block game-status-owned">✅ Already in your Library</div>
            <div class="mt-2 text-center" style="font-size:.78rem;color:rgba(255,255,255,.35)">You already own this game</div>`;
        } else if (inCart) {
          buySection = priceHtml + `
            <div class="game-status-block game-status-incart">🛒 Already in your Cart</div>
            <div class="mt-2 text-center" style="font-size:.78rem;color:rgba(255,255,255,.35)">
              <a href="cart.html" style="color:rgba(0,212,255,.8);text-decoration:none">Go to cart →</a>
            </div>`;
        } else {
          buySection = priceHtml + `
            <button class="btn-add-cart" id="addCartBtn" onclick="addToCart(${game.id})">🛒 Add to Cart</button>`;
        }
      } else {
        buySection = `
          ${priceHtml}
          <div class="login-prompt"><a href="login.html">Sign in</a> to purchase this game</div>`;
      }

      document.getElementById('gameDetailContainer').innerHTML = `
        <a href="index.html" class="back-link">← Back to Store</a>
        <div class="game-detail-hero">
          <img src="${escAttr(imgSrc)}" alt="${escAttr(game.title)}" onerror="this.src='../assets/profile.png'">
          <div class="game-detail-hero-overlay"></div>
          <div class="game-detail-hero-content">
            <h1 class="game-detail-title">${escHtml(game.title)}</h1>
            <div class="game-detail-meta">
              <span class="genre-tag">${escHtml(game.genre || 'General')}</span>
            </div>
          </div>
        </div>
        <div class="row g-4 align-items-start">
          <div class="col-md-8">
            <div class="game-detail-card">
              <h5 class="text-white fw-bold mb-3" style="font-family:'Rajdhani',sans-serif">📖 About This Game</h5>
              <p class="game-detail-desc">${escHtml(game.description || 'No description available.')}</p>
          
              </div>
          
          
            </div>
          
          <div class="col-md-4">
            <div class="game-buy-card">${buySection}</div>
          </div>
        </div>`;
// Insert after the row closing tag in renderGame():
document.getElementById('gameDetailContainer').innerHTML += `
  <div id="reviewsSection" class="mt-4">
    <div class="text-center text-white-50 py-3">Loading reviews…</div>
  </div>`;

initReviews(game.id, session);
      document.title = `${game.title} — Game Center`;
    }

    function addToCart(gameId) {
      const btn = document.getElementById('addCartBtn');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Adding…';

      const fd = new FormData();
      fd.append('action', 'add');
      fd.append('game_id', gameId);
      fd.append('quantity', 1);

      // ✅ Updated path
      fetch('../features/cart/cart.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            const buyCard = btn.closest('.game-buy-card');
            btn.remove();
            const div = document.createElement('div');
            div.innerHTML = `
              <div class="game-status-block game-status-incart">🛒 Added to Cart</div>
              <div class="mt-2 text-center" style="font-size:.78rem;color:rgba(255,255,255,.35)">
                <a href="cart.html" style="color:rgba(0,212,255,.8);text-decoration:none">Go to cart →</a>
              </div>`;
            buyCard.appendChild(div);
            // Update navbar badge
            fetch('../features/cart/cart.php?action=count')
              .then(r => r.json())
              .then(d => {
                const badge = document.getElementById('cartCountBadge');
                const count = parseInt(d.total) || 0;
                if (badge) badge.textContent = count > 0 ? count : '';
              });
          } else {
            btn.disabled = false;
            btn.textContent = '🛒 Add to Cart';
            alert(d.error || 'Failed to add to cart.');
          }
        })
        .catch(() => {
          btn.disabled = false;
          btn.textContent = '🛒 Add to Cart';
          alert('Error adding to cart.');
        });
    }

    function escHtml(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return String(s??'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
<script src="../JS/reviews.js"></script>
</body>

</html>
