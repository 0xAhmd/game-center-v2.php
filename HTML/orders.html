<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — Game Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
</head>
<body>

  <nav class="gc-navbar">
    <div class="gc-nav-brand">
      <a href="index.html" style="text-decoration:none;color:inherit">
        <img src="../assets/logo.png" alt="Logo" width="40" onerror="this.style.display='none'">
        <span>Game Center</span>
      </a>
    </div>
    <div class="gc-nav-actions" id="navActions"></div>
  </nav>

  <div class="container py-5">
    <h2 class="text-white fw-bold mb-4" id="ordersHeading">📦 My Orders</h2>
    <div id="ordersContainer">
      <div class="text-center text-white py-5">
        <div class="spinner-border text-light"></div>
        <p class="mt-2">Loading orders...</p>
      </div>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-white rounded-4 p-4">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Order Details</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="orderDetailBody">
          <div class="text-center py-3"><div class="spinner-border text-light"></div></div>
        </div>
        <!-- Admin status updater -->
        <div class="modal-footer border-0" id="adminStatusFooter" style="display:none">
          <label class="text-white me-2">Update Status:</label>
          <select id="statusSelect" class="form-select form-select-sm w-auto me-2">
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button class="btn btn-sm btn-success" onclick="updateOrderStatus()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth_ui.js"></script>
  <script src="../JS/orders.js"></script>
</body>
</html>
