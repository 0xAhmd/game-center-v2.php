<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — Game Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
</head>
<body>

  <nav class="gc-navbar">
    <div class="gc-nav-brand">
      <a href="index.html" style="text-decoration:none;color:inherit">
        <img src="../assets/logo.png" alt="Logo" width="40" onerror="this.style.display='none'">
        <span>Game Center</span>
      </a>
    </div>
    <div class="gc-nav-actions" id="navActions"></div>
  </nav>

  <div class="container py-5">
    <h2 class="text-white fw-bold mb-4">🛒 Your Cart</h2>

    <div id="cartContainer">
      <div class="text-center text-white py-5">
        <div class="spinner-border text-light"></div>
        <p class="mt-2">Loading cart...</p>
      </div>
    </div>
  </div>

  <!-- Checkout confirm modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white rounded-4 p-4">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Confirm Order</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>You're about to place an order totalling <strong id="checkoutTotal"></strong>.</p>
          <p class="text-white-50">Your cart will be cleared after checkout.</p>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-success px-5" onclick="confirmCheckout()">Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth_ui.js"></script>
  <script src="../JS/cart.js"></script>
</body>
</html>
