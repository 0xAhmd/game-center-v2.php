<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — Game Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="icon" type="image/png" href="../assets/profile.png">
  <style>
    /* ── Avatar upload ─────────────────────────────────────── */
    .profile-avatar-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 14px;
    }
    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gc-purple), var(--gc-purple-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      box-shadow: 0 0 30px rgba(108,60,225,0.4);
      letter-spacing: 1px;
      overflow: hidden;
      cursor: pointer;
      transition: filter .2s;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .profile-avatar-wrap:hover .profile-avatar { filter: brightness(.6); }
    .profile-avatar-wrap:hover .avatar-edit-hint { opacity: 1; }
    .avatar-edit-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      letter-spacing: .3px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    #avatarFileInput { display: none; }
    .avatar-upload-spinner {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.55);
      border-radius: 50%;
    }
    .avatar-upload-spinner.active { display: flex; }
  </style>
</head>
<body>

  <nav class="gc-navbar">
    <div class="gc-nav-brand">
      <a href="index.html" style="text-decoration:none;color:inherit">
        <img src="../assets/logo.png" alt="Logo" width="40" onerror="this.style.display='none'">
        <span>Game Center</span>
      </a>
    </div>
    <div class="gc-nav-actions" id="navActions"></div>
  </nav>

  <div class="container py-5" id="profileContainer">
    <div class="text-center text-white py-5">
      <div class="spinner-border text-light"></div>
      <p class="mt-2">Loading profile...</p>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white rounded-4 p-4">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">🔒 Change Password</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="pwAlert"></div>
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" id="currentPw" class="form-control" placeholder="••••••••">
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="newPw" class="form-control" placeholder="Min. 6 characters">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirmPw" class="form-control" placeholder="Repeat new password">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary px-4" onclick="submitPasswordChange()">Update Password</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden avatar file input -->
  <input type="file" id="avatarFileInput" accept="image/jpeg,image/png,image/webp,image/gif">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/auth_ui.js"></script>
  <script>
    let profileData = null;

    // Auth guard
    fetch('../scripts/session_status.php')
      .then(r => r.json())
      .then(s => {
        if (!s.logged_in) { window.location.href = 'login.html'; return; }
        loadProfile();
      });

    function loadProfile() {
      fetch('../scripts/profile.php?action=get')
        .then(r => r.json())
        .then(data => {
          profileData = data;
          renderProfile(data);
        })
        .catch(() => {
          document.getElementById('profileContainer').innerHTML =
            '<div class="alert alert-danger">Failed to load profile.</div>';
        });
    }

    function renderProfile(data) {
      const { user, stats, recent_orders } = data;
      const isAdmin = user.role === 'admin';
      const joined  = new Date(user.created_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
      const initials = user.username.slice(0, 2).toUpperCase();

      // Avatar: use uploaded image or fallback to initials
      const avatarInner = user.avatar_path
        ? `<img src="../${escAttr(user.avatar_path)}?v=${Date.now()}" alt="Avatar"
               onerror="this.parentElement.innerHTML='${initials}'">`
        : initials;

      const statusColors = {
        pending: 'status-pending', processing: 'status-processing',
        completed: 'status-completed', cancelled: 'status-cancelled'
      };

      let recentOrdersHtml = '';
      if (recent_orders.length === 0) {
        recentOrdersHtml = `<p class="text-white-50 text-center py-3">No orders yet. <a href="index.html" class="text-decoration-none" style="color:var(--gc-purple-2)">Browse games →</a></p>`;
      } else {
        recentOrdersHtml = recent_orders.map(o => {
          const date = new Date(o.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          return `
            <div class="recent-order-row">
              <div>
                <span class="text-white fw-bold">#${o.id}</span>
                <span class="text-white-50 ms-2" style="font-size:.8rem">${date}</span>
              </div>
              <div class="d-flex align-items-center gap-3">
                <span class="text-white-50" style="font-size:.85rem">${o.item_count} game${o.item_count != 1 ? 's' : ''}</span>
                <span class="text-white fw-bold">$${parseFloat(o.total_price).toFixed(2)}</span>
                <span class="order-status ${statusColors[o.status] || ''}">${o.status}</span>
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('profileContainer').innerHTML = `
        <div class="profile-layout">

          <!-- Left: Avatar + Info Card -->
          <div class="profile-sidebar">
            <div class="profile-card">

              <!-- Avatar with click-to-upload -->
              <div class="profile-avatar-wrap" onclick="triggerAvatarUpload()" title="Click to change profile picture">
                <div class="profile-avatar" id="profileAvatarEl">
                  ${avatarInner}
                </div>
                <div class="avatar-edit-hint">📷 Change</div>
                <div class="avatar-upload-spinner" id="avatarSpinner">
                  <div class="spinner-border spinner-border-sm text-light"></div>
                </div>
              </div>

              ${isAdmin ? '<div class="profile-role-badge">⚙️ Admin</div>' : '<div class="profile-role-badge user-badge">🎮 Player</div>'}
              <div class="profile-name" id="displayUsername">${escHtml(user.username)}</div>
              <div class="profile-email" id="displayEmail">${escHtml(user.email)}</div>
              <div class="profile-joined">Member since ${joined}</div>
              <div id="avatarMsg" style="font-size:.75rem;min-height:18px;margin-bottom:8px"></div>
              <div class="profile-actions">
                <button class="btn btn-outline-light btn-sm w-100" onclick="openPasswordModal()">
                  🔒 Change Password
                </button>
                ${isAdmin ? `<a href="admin.html" class="btn btn-sm w-100 mt-2" style="background:rgba(108,60,225,.25);border:1px solid rgba(108,60,225,.4);color:#c4a8ff">⚙️ Admin Dashboard</a>` : ''}
              </div>
            </div>

            ${!isAdmin ? `
            <!-- Stats Card -->
            <div class="stats-mini-card">
              <div class="stats-mini-row">
                <span class="stats-mini-label">Total Orders</span>
                <span class="stats-mini-val">${stats.total_orders}</span>
              </div>
              <div class="stats-mini-row">
                <span class="stats-mini-label">Completed</span>
                <span class="stats-mini-val" style="color:#28a865">${stats.completed_orders}</span>
              </div>
              <div class="stats-mini-row">
                <span class="stats-mini-label">Pending</span>
                <span class="stats-mini-val" style="color:#ffc107">${stats.pending_orders}</span>
              </div>
              <div class="stats-mini-row" style="border-top:1px solid rgba(255,255,255,.08);margin-top:8px;padding-top:12px">
                <span class="stats-mini-label">Total Spent</span>
                <span class="stats-mini-val" style="color:var(--gc-cyan)">$${parseFloat(stats.total_spent).toFixed(2)}</span>
              </div>
            </div>` : ''}
          </div>

          <!-- Right: Edit Form + Recent Orders -->
          <div class="profile-main">

            <!-- Edit Profile -->
            <div class="profile-section">
              <h5 class="profile-section-title">✏️ Edit Profile</h5>
              <div id="editAlert"></div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Username</label>
                  <input type="text" id="editUsername" class="form-control" value="${escAttr(user.username)}" maxlength="50">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email Address</label>
                  <input type="email" id="editEmail" class="form-control" value="${escAttr(user.email)}">
                </div>
              </div>
              <div class="mt-3">
                <button class="btn btn-primary px-4" onclick="saveProfile()">Save Changes</button>
              </div>
            </div>

            <!-- Recent Orders (users only) -->
            ${!isAdmin ? `
            <div class="profile-section">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="profile-section-title mb-0">📦 Recent Orders</h5>
                <a href="orders.html" class="btn btn-sm btn-outline-light">View All</a>
              </div>
              <div class="recent-orders-list">
                ${recentOrdersHtml}
              </div>
            </div>` : `
            <div class="profile-section">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="profile-section-title mb-0">⚡ Quick Actions</h5>
              </div>
              <div class="row g-3">
                <div class="col-sm-6">
                  <a href="admin.html" class="quick-action-card">
                    <div class="qa-icon">📊</div>
                    <div class="qa-label">Dashboard</div>
                  </a>
                </div>
                <div class="col-sm-6">
                  <a href="orders.html" class="quick-action-card">
                    <div class="qa-icon">📦</div>
                    <div class="qa-label">All Orders</div>
                  </a>
                </div>
                <div class="col-sm-6">
                  <a href="add.html" class="quick-action-card">
                    <div class="qa-icon">➕</div>
                    <div class="qa-label">Add Game</div>
                  </a>
                </div>
                <div class="col-sm-6">
                  <a href="index.html" class="quick-action-card">
                    <div class="qa-icon">🎮</div>
                    <div class="qa-label">Store</div>
                  </a>
                </div>
              </div>
            </div>`}

          </div>
        </div>`;

      // Bind avatar file input after DOM is updated
      document.getElementById('avatarFileInput').addEventListener('change', handleAvatarChange);
    }

    // ── Avatar upload ──────────────────────────────────────────────────────
    function triggerAvatarUpload() {
      document.getElementById('avatarFileInput').click();
    }

    function handleAvatarChange(e) {
      const file = e.target.files[0];
      if (!file) return;

      const spinner = document.getElementById('avatarSpinner');
      const msgEl   = document.getElementById('avatarMsg');
      spinner.classList.add('active');
      msgEl.innerHTML = '';

      const fd = new FormData();
      fd.append('avatar', file);

      fetch('../scripts/upload_avatar.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          spinner.classList.remove('active');
          if (d.success) {
            const avatarEl = document.getElementById('profileAvatarEl');
            const initials = (profileData?.user?.username || 'U').slice(0,2).toUpperCase();
            avatarEl.innerHTML = `<img src="../${escAttr(d.avatar_path)}?v=${Date.now()}" alt="Avatar"
              onerror="this.parentElement.innerHTML='${initials}'">`;
            msgEl.innerHTML = `<span style="color:#28a865">✅ Photo updated</span>`;
            setTimeout(() => { msgEl.innerHTML = ''; }, 3000);
          } else {
            msgEl.innerHTML = `<span style="color:#ff9d9d">⚠️ ${escHtml(d.error)}</span>`;
          }
        })
        .catch(() => {
          spinner.classList.remove('active');
          const msgEl = document.getElementById('avatarMsg');
          if (msgEl) msgEl.innerHTML = `<span style="color:#ff9d9d">Upload failed.</span>`;
        });

      e.target.value = '';
    }

    // ── Save profile ───────────────────────────────────────────────────────
    function saveProfile() {
      const username = document.getElementById('editUsername').value.trim();
      const email    = document.getElementById('editEmail').value.trim();
      const alertDiv = document.getElementById('editAlert');

      const fd = new FormData();
      fd.append('action', 'update');
      fd.append('username', username);
      fd.append('email', email);

      fetch('../scripts/profile.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            alertDiv.innerHTML = `<div class="alert-profile alert-profile-success">✅ Profile updated successfully!</div>`;
            document.getElementById('displayUsername').textContent = username;
            document.getElementById('displayEmail').textContent = email;
            setTimeout(() => alertDiv.innerHTML = '', 3000);
          } else {
            alertDiv.innerHTML = `<div class="alert-profile alert-profile-danger">⚠️ ${escHtml(d.error)}</div>`;
          }
        })
        .catch(() => {
          alertDiv.innerHTML = `<div class="alert-profile alert-profile-danger">Failed to save changes.</div>`;
        });
    }

    function openPasswordModal() {
      document.getElementById('currentPw').value  = '';
      document.getElementById('newPw').value      = '';
      document.getElementById('confirmPw').value  = '';
      document.getElementById('pwAlert').innerHTML = '';
      new bootstrap.Modal(document.getElementById('passwordModal')).show();
    }

    function submitPasswordChange() {
      const current = document.getElementById('currentPw').value;
      const newPw   = document.getElementById('newPw').value;
      const confirm = document.getElementById('confirmPw').value;
      const alertDiv = document.getElementById('pwAlert');

      const fd = new FormData();
      fd.append('action', 'change_password');
      fd.append('current_password', current);
      fd.append('new_password', newPw);
      fd.append('confirm_password', confirm);

      fetch('../scripts/profile.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            alertDiv.innerHTML = `<div class="alert-profile alert-profile-success mb-3">✅ Password changed successfully!</div>`;
            setTimeout(() => {
              bootstrap.Modal.getInstance(document.getElementById('passwordModal')).hide();
            }, 1500);
          } else {
            alertDiv.innerHTML = `<div class="alert-profile alert-profile-danger mb-3">⚠️ ${escHtml(d.error)}</div>`;
          }
        })
        .catch(() => {
          alertDiv.innerHTML = `<div class="alert-profile alert-profile-danger mb-3">Request failed.</div>`;
        });
    }

    function escHtml(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return String(s??'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  </script>
</body>
</html>
